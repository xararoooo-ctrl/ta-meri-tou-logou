<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ο κυνηγός των μερών του λόγου</title><style>body{font-family:Arial,sans-serif;background:#eef6ff;text-align:center;margin:0;padding:25px;color:#20304b}main{max-width:780px;margin:auto;background:white;padding:30px;border-radius:25px;box-shadow:0 8px 25px #b5c9dc}h1{color:#2859a4}#word{font-size:clamp(38px,7vw,65px);font-weight:bold;margin:30px}button{font-size:clamp(20px,3vw,29px);padding:19px;border:0;border-radius:15px;cursor:pointer;margin:7px;min-width:190px;color:white}button:disabled{opacity:.6;cursor:default}.noun{background:#2864ca}.verb{background:#23864d}.adj{background:#db7b21}#next,#restart{background:#6847aa}#feedback{font-size:24px;min-height:60px;font-weight:bold}#progress{font-size:19px}small{display:block;margin-top:25px}</style></head><body><main><h1>🎯 Ο κυνηγός των μερών του λόγου</h1><p>Γ΄ και Δ΄ Δημοτικού • Διάλεξε τι είναι η λέξη!</p><div id="progress"></div><div id="word"></div><div id="choices"><button class="noun" onclick="answer('Ουσιαστικό')">Ουσιαστικό</button><button class="verb" onclick="answer('Ρήμα')">Ρήμα</button><button class="adj" onclick="answer('Επίθετο')">Επίθετο</button></div><div id="feedback" aria-live="polite"></div><button id="next" onclick="advance()" hidden>Επόμενη λέξη ➜</button><button id="restart" onclick="restart()" hidden>Παίζω ξανά ↻</button><small>Η τάξη μου • Παίζουμε, ανακαλύπτουμε και μαθαίνουμε!</small></main><script>const items=[['σχολείο','Ουσιαστικό'],['τρέχω','Ρήμα'],['όμορφος','Επίθετο'],['θάλασσα','Ουσιαστικό'],['γράφω','Ρήμα'],['φωτεινός','Επίθετο'],['παιχνίδι','Ουσιαστικό'],['χορεύω','Ρήμα'],['χαρούμενη','Επίθετο'],['δάσος','Ουσιαστικό'],['ταξιδεύω','Ρήμα'],['ψηλό','Επίθετο'],['βιβλιοθήκη','Ουσιαστικό'],['σκέφτομαι','Ρήμα'],['ήσυχος','Επίθετο'],['φιλία','Ουσιαστικό'],['ανακαλύπτω','Ρήμα'],['πολύχρωμη','Επίθετο'],['περιπέτεια','Ουσιαστικό'],['προσπαθώ','Ρήμα']];let index=0,score=0,answered=false;function render(){document.getElementById('word').textContent=items[index][0];document.getElementById('progress').textContent=`Λέξη ${index+1} από ${items.length} • Πόντοι: ${score}`;document.getElementById('feedback').textContent='';document.getElementById('next').hidden=true;document.getElementById('choices').hidden=false;document.querySelectorAll('#choices button').forEach(b=>b.disabled=false);answered=false}function answer(choice){if(answered)return;answered=true;let correct=items[index][1];if(choice===correct){score++;document.getElementById('feedback').textContent='🌟 Μπράβο! Σωστή απάντηση!'}else{document.getElementById('feedback').textContent=`💡 Η σωστή απάντηση είναι: ${correct}. Συνέχισε!`}document.querySelectorAll('#choices button').forEach(b=>b.disabled=true);document.getElementById('progress').textContent=`Λέξη ${index+1} από ${items.length} • Πόντοι: ${score}`;document.getElementById('next').textContent=index===items.length-1?'Δες το αποτέλεσμα ➜':'Επόμενη λέξη ➜';document.getElementById('next').hidden=false}function advance(){if(index<items.length-1){index++;render()}else{document.getElementById('word').textContent=`${score} / ${items.length}`;document.getElementById('progress').textContent='Ολοκλήρωσες το παιχνίδι!';document.getElementById('feedback').textContent=score>=16?'🏆 Εξαιρετική προσπάθεια!':'👏 Μπράβο για την προσπάθεια! Παίξε ξανά για εξάσκηση.';document.getElementById('choices').hidden=true;document.getElementById('next').hidden=true;document.getElementById('restart').hidden=false}}function restart(){index=0;score=0;document.getElementById('restart').hidden=true;render()}render();</script></body></html>
